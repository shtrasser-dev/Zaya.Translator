  assemblies:
  - Zaya.Translator
  namespace: Zaya.Translator.Services.Impl
  summary: >-
    Decorator over <xref href="Zaya.Translator.Services.ITranslatorSession" data-throw-if-not-resolved="false"></xref> that caches translation results

    using an <xref href="Zaya.Translator.Services.ITranslationCache" data-throw-if-not-resolved="false"></xref> instance. Both single-text and batch

    <code>TranslateAsync</code> calls are intercepted: cached texts are returned

    immediately, and only uncached texts are forwarded to the inner session.
  example: []
  syntax:
