  summary: >-
    Gets the descriptor list containing cache-related settings:


    <ul><li><xref href="Zaya.Translator.Services.Impl.CacheSettingsKeys.EnableCache" data-throw-if-not-resolved="false"></xref> – boolean toggle (default: true).</li><li><xref href="Zaya.Translator.Services.Impl.CacheSettingsKeys.CacheTtlMinutes" data-throw-if-not-resolved="false"></xref> – integer TTL in minutes (default: 0 = unlimited).</li></ul>
  example: []
