  summary: >-
    Provides the <xref href="Zaya.Primitives.SettingDescriptor" data-throw-if-not-resolved="false"></xref> list for cache configuration.

    Translators include <xref href="Zaya.Translator.Services.Impl.CacheSettingDescriptors.All" data-throw-if-not-resolved="false"></xref> in their own <code>BuildSettings()</code>

    return value so that the cache settings are rendered and read together with

    the translator's own settings.
