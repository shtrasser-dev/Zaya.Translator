  assemblies:
  - Zaya.Translator
  namespace: Zaya.Translator.Services.Impl
  summary: >-
    Wraps the specified session with a <xref href="Zaya.Translator.Services.Impl.CachingTranslatorSession" data-throw-if-not-resolved="false"></xref>

    if the <xref href="Zaya.Translator.Services.Impl.CacheSettingsKeys.EnableCache" data-throw-if-not-resolved="false"></xref> setting is <code>true</code>.
  example: []
  syntax:
    content: public static ITranslatorSession TryWrap(ITranslatorSession session, SettingDescriptorList settings)
    parameters:
    - id: session
      type: Zaya.Translator.Services.ITranslatorSession
      description: The inner translator session to wrap.
    - id: settings
      type: Zaya.Primitives.SettingDescriptorList
      description: >-
        A <xref href="Zaya.Primitives.SettingDescriptorList" data-throw-if-not-resolved="false"></xref> bound to the engine settings dictionary.

        Must contain <xref href="Zaya.Translator.Services.Impl.CacheSettingsKeys.EnableCache" data-throw-if-not-resolved="false"></xref> and optionally

        <xref href="Zaya.Translator.Services.Impl.CacheSettingsKeys.CacheTtlMinutes" data-throw-if-not-resolved="false"></xref>.
    return:
      type: Zaya.Translator.Services.ITranslatorSession
      description: >-
        The original <code class="paramref">session</code> if caching is disabled,

        or a new <xref href="Zaya.Translator.Services.Impl.CachingTranslatorSession" data-throw-if-not-resolved="false"></xref> wrapping it otherwise.
    content.vb: Public Shared Function TryWrap(session As ITranslatorSession, settings As SettingDescriptorList) As ITranslatorSession
  overload: Zaya.Translator.Services.Impl.CacheFactory.TryWrap*
