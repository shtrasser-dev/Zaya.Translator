  summary: >-
    Factory that conditionally wraps an <xref href="Zaya.Translator.Services.ITranslatorSession" data-throw-if-not-resolved="false"></xref>

    with a <xref href="Zaya.Translator.Services.Impl.CachingTranslatorSession" data-throw-if-not-resolved="false"></xref> based on engine settings.

    Translators call <xref href="Zaya.Translator.Services.Impl.CacheFactory.TryWrap(Zaya.Translator.Services.ITranslatorSession%2cZaya.Primitives.SettingDescriptorList)" data-throw-if-not-resolved="false"></xref> in their <code>CreateSessionAsync</code>

    to add caching transparently when enabled by the user.
